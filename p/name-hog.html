async function key(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function open_(pw){const r=b(D),salt=r.slice(0,16),iv=r.slice(16,28),ct=r.slice(28);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},await key(pw,salt),ct);
try{localStorage.setItem("pi_m",pw)}catch(e){}
const h=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
document.open();document.write(h);document.close();}
